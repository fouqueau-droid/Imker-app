<div id="root"></div>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback } = React;

// ============================================================
// Konfiguration
// ============================================================
const CFG = window.APP_CONFIG;
const MALS_LAT = 46.6853;
const MALS_LON = 10.5445;
const FUTTER_OPTIONEN = ["gering", "mittel", "gut", "voll"];
const GESUNDHEIT_OPTIONEN = ["gut", "auffällig", "kritisch"];
const DRIVE_DATEINAME = "imker-app-daten.json";
const LOCAL_KEY = "imker-app-daten-v1";
const DRIVE_FILEID_KEY = "imker-app-drive-file-id";
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";

// ============================================================
// Lokaler Speicher (funktioniert immer, auch offline)
// ============================================================
function ladeLokal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    return raw ? JSON.parse(raw) : { voelker: [], standorte: [] };
  } catch {
    return { voelker: [], standorte: [] };
  }
}
function speichereLokal(daten) {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(daten));
    return true;
  } catch (e) {
    console.error("Lokaler Speicher voll oder Fehler:", e);
    return false;
  }
}

// ============================================================
// Google Drive Sync
// ============================================================
let tokenClient = null;
let accessToken = null;

function initGoogle(onToken) {
  if (!window.google || tokenClient) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CFG.GOOGLE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: (resp) => {
      if (resp && resp.access_token) {
        accessToken = resp.access_token;
        onToken(resp.access_token);
      }
    }
  });
}
function googleAnmelden() {
  if (tokenClient) tokenClient.requestAccessToken({ prompt: "consent" });
}
function googleStillErneuern() {
  if (tokenClient) tokenClient.requestAccessToken({ prompt: "" });
}

async function driveFindeDatei() {
  const cachedId = localStorage.getItem(DRIVE_FILEID_KEY);
  if (cachedId) return cachedId;
  const url = `https://www.googleapis.com/drive/v3/files?q=name%3D%27${DRIVE_DATEINAME}%27+and+trashed%3Dfalse&spaces=drive&fields=files(id,name)`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${accessToken}` } });
  const data = await res.json();
  if (data.files && data.files.length > 0) {
    localStorage.setItem(DRIVE_FILEID_KEY, data.files[0].id);
    return data.files[0].id;
  }
  return null;
}

async function drivePull() {
  const id = await driveFindeDatei();
  if (!id) return null;
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {
    headers: { Authorization: `Bearer ${accessToken}` }
  });
  if (!res.ok) throw new Error("Drive-Abruf fehlgeschlagen");
  return await res.json();
}

async function drivePush(daten) {
  let id = await driveFindeDatei();
  const json = JSON.stringify(daten);

  if (!id) {
    const boundary = "imkerapp" + Date.now();
    const metadata = { name: DRIVE_DATEINAME, mimeType: "application/json" };
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${json}\r\n--${boundary}--`;
    const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {
      method: "POST",
      headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
      body
    });
    if (!res.ok) throw new Error("Drive-Erstellung fehlgeschlagen");
    const data = await res.json();
    localStorage.setItem(DRIVE_FILEID_KEY, data.id);
    return;
  }

  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json" },
    body: json
  });
  if (!res.ok) {
    if (res.status === 401) throw { code: 401 };
    throw new Error("Drive-Update fehlgeschlagen");
  }
}

// ============================================================
// Bild komprimieren
// ============================================================
function komprimiereBild(file, maxBreite = 900, qualitaet = 0.68) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxBreite / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", qualitaet));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============================================================
// Wetter (Open-Meteo, kein Key nötig)
// ============================================================
function useWetter() {
  const [wetter, setWetter] = useState(null);
  const [status, setStatus] = useState("laden");
  useEffect(() => {
    let cancelled = false;
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${MALS_LAT}&longitude=${MALS_LON}&current=temperature_2m,precipitation,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Europe/Berlin`)
      .then((r) => r.json())
      .then((d) => { if (!cancelled) { setWetter(d); setStatus("ok"); } })
      .catch(() => { if (!cancelled) setStatus("fehler"); });
    return () => { cancelled = true; };
  }, []);
  return { wetter, status };
}
function wetterEmoji(code) {
  if (code === 0) return "☀️";
  if ([1, 2, 3].includes(code)) return "⛅";
  if ([45, 48].includes(code)) return "🌫️";
  if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return "🌧️";
  if ([71, 73, 75].includes(code)) return "🌨️";
  if (code === 95) return "⛈️";
  return "☁️";
}
function wetterText(code) {
  const map = { 0: "Klar", 1: "Überwiegend klar", 2: "Teilweise bewölkt", 3: "Bedeckt", 45: "Nebel", 48: "Reifnebel",
    51: "Leichter Nieselregen", 53: "Nieselregen", 55: "Starker Nieselregen", 61: "Leichter Regen", 63: "Regen",
    65: "Starker Regen", 71: "Leichter Schneefall", 73: "Schneefall", 75: "Starker Schneefall",
    80: "Regenschauer", 81: "Regenschauer", 82: "Starke Regenschauer", 95: "Gewitter" };
  return map[code] || "—";
}

// ============================================================
// Diktat-Parsing
// ============================================================
function parseTranskript(text) {
  const t = text.toLowerCase();
  const felder = {};
  let m = t.match(/(\d+)\s*(brutwaben|brutnest(?:waben)?|waben brut)/);
  if (m) felder.brutstaerke = parseInt(m[1], 10);
  m = t.match(/(\d+)\s*zargen/);
  if (m) felder.zargen = parseInt(m[1], 10);
  if (/futter\s*(gering|wenig|knapp)/.test(t)) felder.futtervorrat = "gering";
  else if (/futter\s*(mittel)/.test(t)) felder.futtervorrat = "mittel";
  else if (/futter\s*(gut)/.test(t)) felder.futtervorrat = "gut";
  else if (/futter\s*(voll|reichlich)/.test(t)) felder.futtervorrat = "voll";
  if (/königin\s*(nicht\s*)?gesehen/.test(t)) felder.koeniginGesehen = !/nicht\s*gesehen/.test(t);
  else if (/königin\s*vorhanden/.test(t)) felder.koeniginGesehen = true;
  if (/(schwarmstimmung|weiselzellen)\s*(ja|vorhanden|gefunden)/.test(t) || (/weiselzellen/.test(t) && !/keine weiselzellen/.test(t))) felder.schwarmstimmung = true;
  else if (/(keine\s*(schwarmstimmung|weiselzellen)|schwarmstimmung\s*nein)/.test(t)) felder.schwarmstimmung = false;
  m = t.match(/varroa[^\d]*(\d+)/);
  if (m) felder.varroaBefall = parseInt(m[1], 10);
  m = t.match(/(\d+([.,]\d+)?)\s*kg\s*(honig)?/);
  if (m) felder.honigernteKg = parseFloat(m[1].replace(",", "."));
  if (/gesundheit(szustand)?\s*gut|volk\s*gesund/.test(t)) felder.gesundheit = "gut";
  else if (/auffällig/.test(t)) felder.gesundheit = "auffällig";
  else if (/kritisch|krank/.test(t)) felder.gesundheit = "kritisch";
  return { felder, rohtext: text };
}
function feldLabel(k) {
  const map = { brutstaerke: "Brutwaben", zargen: "Zargen", futtervorrat: "Futter", koeniginGesehen: "Königin gesehen",
    schwarmstimmung: "Schwarmstimmung", varroaBefall: "Varroa", honigernteKg: "Honig (kg)", gesundheit: "Gesundheit" };
  return map[k] || k;
}
function useSpeechRecognition(onResult) {
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const ref = useRef(null);
  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const r = new SR();
    r.lang = "de-DE"; r.continuous = true; r.interimResults = false;
    r.onresult = (e) => {
      let text = "";
      for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) text += e.results[i][0].transcript + " ";
      if (text.trim()) onResult(text.trim());
    };
    r.onerror = () => setListening(false);
    r.onend = () => setListening(false);
    ref.current = r;
  }, [onResult]);
  const start = () => { try { ref.current.start(); setListening(true); } catch { setListening(false); } };
  const stop = () => { ref.current && ref.current.stop(); setListening(false); };
  return { listening, supported, start, stop };
}

// ============================================================
// KI-Aufrufe über den eigenen Cloudflare-Worker
// ============================================================
async function rufeWorkerAuf(body) {
  const res = await fetch(CFG.WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-App-Secret": CFG.APP_SECRET },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error("KI-Anfrage fehlgeschlagen (" + res.status + ")");
  const data = await res.json();
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
}
function getJahreszeit() {
  const m = new Date().getMonth() + 1;
  if ([12, 1, 2].includes(m)) return "Winter";
  if ([3, 4, 5].includes(m)) return "Frühjahr";
  if ([6, 7, 8].includes(m)) return "Sommer";
  return "Herbst";
}
async function holeKiTipp({ volk, standortName, letzterEintrag, wetter }) {
  const kontext = `Du bist ein erfahrener Berufsimker und gibst einem Hobbyimker in Mals im Vinschgau (Südtirol, ca. 1050m Höhe, Bergklima) konkrete, kurze Praxistipps zur Völkerführung.

Volk: ${volk.name || "Unbenannt"} (Stand: ${standortName || "unbekannt"})
Jahreszeit: ${getJahreszeit()}
Letzte Kontrolle: ${letzterEintrag ? JSON.stringify(letzterEintrag) : "noch keine Daten vorhanden"}
Aktuelles Wetter: ${wetter ? `${wetter.current?.temperature_2m}°C, Niederschlag ${wetter.current?.precipitation}mm, Wind ${wetter.current?.wind_speed_10m}km/h` : "nicht verfügbar"}

Gib maximal 3 knappe, konkrete Handlungsempfehlungen (Stichpunkte, kein Fließtext, kein Vorspann). Antworte ausschließlich auf Deutsch.`;
  return rufeWorkerAuf({ messages: [{ role: "user", content: kontext }] });
}
async function holeFotoAnalyse({ dataUrl, volkName, notiz }) {
  const match = dataUrl.match(/^data:(image\/\w+);base64,(.+)$/);
  if (!match) throw new Error("Ungültiges Bildformat");
  const promptText = `Du bist ein erfahrener Berufsimker. Analysiere dieses Foto aus dem Bienenstand "${volkName || "unbekannt"}"${notiz ? ` (Notiz: "${notiz}")` : ""}.
Beschreibe knapp (max. 4 Stichpunkte): 1) was zu erkennen ist, 2) Auffälligkeiten falls erkennbar, 3) eine Handlungsempfehlung falls angebracht.
Falls nichts Eindeutiges erkennbar ist, sag das ehrlich. Antworte ausschließlich auf Deutsch, ohne Vorspann.`;
  return rufeWorkerAuf({
    messages: [{ role: "user", content: [
      { type: "image", source: { type: "base64", media_type: match[1], data: match[2] } },
      { type: "text", text: promptText }
    ]}]
  });
}

// Mini-SVG-Liniengrafik (ersetzt recharts)
// ============================================================
function MiniLinienGrafik({ history }) {
  const data = history.slice().sort((a, b) => new Date(a.datum) - new Date(b.datum));
  if (data.length === 0) return <div className="grafik-leer">Noch keine Kontrollen erfasst — Grafik erscheint nach dem ersten Eintrag.</div>;

  const w = 300, h = 160, padL = 30, padB = 22, padT = 10, padR = 10;
  const werte = (key) => data.map((d) => d[key]).filter((v) => v !== undefined && v !== null);
  const alleWerte = [...werte("brutstaerke"), ...werte("varroaBefall")];
  const maxY = Math.max(1, ...alleWerte);
  const stepX = data.length > 1 ? (w - padL - padR) / (data.length - 1) : 0;

  const pfad = (key) => {
    let d = "", begonnen = false;
    data.forEach((pt, i) => {
      const v = pt[key];
      const x = padL + i * stepX;
      if (v === undefined || v === null) { begonnen = false; return; }
      const y = padT + (1 - v / maxY) * (h - padT - padB);
      d += (begonnen ? " L " : " M ") + x + " " + y;
      begonnen = true;
    });
    return d;
  };

  return (
    <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", height: 200 }}>
      {[0, 0.5, 1].map((f, i) => (
        <line key={i} x1={padL} x2={w - padR} y1={padT + f * (h - padT - padB)} y2={padT + f * (h - padT - padB)} stroke="#E4D9C3" strokeWidth="1" />
      ))}
      <path d={pfad("brutstaerke")} fill="none" stroke="#C97A2B" strokeWidth="2.5" />
      <path d={pfad("varroaBefall")} fill="none" stroke="#8B3A3A" strokeWidth="2" />
      {data.map((pt, i) => {
        const x = padL + i * stepX;
        return (
          <text key={i} x={x} y={h - 4} fontSize="8" textAnchor="middle" fill="#2B2118" opacity="0.6">
            {new Date(pt.datum).toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" })}
          </text>
        );
      })}
      <text x={padL} y={12} fontSize="9" fill="#C97A2B" fontWeight="700">● Brutwaben</text>
      <text x={padL + 70} y={12} fontSize="9" fill="#8B3A3A" fontWeight="700">● Varroa</text>
    </svg>
  );
}

          </button>
        ))}
        <button className="foto-add" onClick={() => fileInputRef.current?.click()} disabled={hochladen}>{hochladen ? "⏳" : "📷+"}</button>
        <input ref={fileInputRef} type="file" accept="image/*" capture="environment" style={{ display: "none" }} onChange={dateiAusgewaehlt} />
      </div>
      {fotos.length === 0 && <div className="grafik-leer">Noch keine Fotos hinterlegt.</div>}
      {ausgewaehltesFoto && (
        <FotoModal foto={ausgewaehltesFoto} volkName={volk.name} onClose={() => setAusgewaehlt(null)}
          onDelete={(id) => { onDeleteFoto(id); setAusgewaehlt(null); }} onUpdateMeta={onUpdateFotoMeta} />
      )}
    </div>
  );
}

function Stockkarte({ volk, standorte, onZurueck, onUpdate, onDelete }) {
  const [zeigeForm, setZeigeForm] = useState(false);
  const [vorausgefuellt, setVorausgefuellt] = useState(null);
  const { wetter } = useWetter();
  const history = volk.history || [];
  const letzterEintrag = history.length ? history[history.length - 1] : null;
  const standortName = standorte.find((s) => s.id === volk.standortId)?.name;

  const eintragSpeichern = (eintrag) => {
    const neu = { ...eintrag,
      brutstaerke: eintrag.brutstaerke === "" ? undefined : Number(eintrag.brutstaerke),
      zargen: eintrag.zargen === "" ? undefined : Number(eintrag.zargen),
      varroaBefall: eintrag.varroaBefall === "" ? undefined : Number(eintrag.varroaBefall),
      honigernteKg: eintrag.honigernteKg === "" ? undefined : Number(eintrag.honigernteKg) };
    onUpdate({ ...volk, history: [...history, neu] });
    setZeigeForm(false); setVorausgefuellt(null);
  };
  const felderAusDiktat = (felder, rohtext) => { setVorausgefuellt({ ...felder, notizen: rohtext }); setZeigeForm(true); };
  const standortAendern = (e) => onUpdate({ ...volk, standortId: e.target.value });
  const fotoHinzufuegen = (meta) => onUpdate({ ...volk, fotos: [...(volk.fotos || []), meta] });
  const fotoLoeschen = (id) => onUpdate({ ...volk, fotos: (volk.fotos || []).filter((f) => f.id !== id) });
  const fotoMetaAktualisieren = (id, patch) => onUpdate({ ...volk, fotos: (volk.fotos || []).map((f) => (f.id === id ? { ...f, ...patch } : f)) });

  return (
    <div>
      <div className="sk-header">
        <button className="icon-btn" onClick={onZurueck}>←</button>
        <div className="sk-titel"><h1>{volk.name}</h1><span className="sk-standort">Königin {volk.koeniginJahr}{volk.beute ? ` · ${volk.beute}` : ""}</span></div>
        <button className="icon-btn danger" onClick={() => onDelete(volk.id)}>🗑️</button>
      </div>
      <div className="standort-auswahl">📍
        <select value={volk.standortId || ""} onChange={standortAendern}>
          <option value="">— kein Stand —</option>
          {standorte.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
        </select>
      </div>
      <DiktatBox onFelder={felderAusDiktat} />
      <div className="karte"><div className="karte-header"><span>Entwicklung</span></div><MiniLinienGrafik history={history} /></div>
      <KiTippBox volk={volk} standortName={standortName} letzterEintrag={letzterEintrag} wetter={wetter} />
      <FotoSection volk={volk} onAddFoto={fotoHinzufuegen} onDeleteFoto={fotoLoeschen} onUpdateFotoMeta={fotoMetaAktualisieren} />
      {zeigeForm ? (
        <div className="karte"><div className="karte-header"><span>Neue Kontrolle</span></div>
          <NeuerEintragForm initial={vorausgefuellt} onSave={eintragSpeichern} onCancel={() => { setZeigeForm(false); setVorausgefuellt(null); }} />
        </div>
      ) : <button className="btn-primary voll" onClick={() => setZeigeForm(true)}>➕ Kontrolle manuell erfassen</button>}
      <div className="karte">
        <div className="karte-header"><span>Verlauf</span></div>
        {history.length === 0 && <div className="grafik-leer">Noch keine Einträge.</div>}
        <div className="verlauf-liste">
          {history.slice().reverse().map((h, i) => (
            <div className="verlauf-eintrag" key={i}>
              <div className="verlauf-datum">{new Date(h.datum).toLocaleDateString("de-DE")}</div>
              <div className="verlauf-details">
                {h.brutstaerke !== undefined && <span>Brut: {h.brutstaerke}</span>}
                {h.futtervorrat && <span>Futter: {h.futtervorrat}</span>}
                {h.gesundheit && <span>Gesundheit: {h.gesundheit}</span>}
                {h.varroaBefall !== undefined && <span>Varroa: {h.varroaBefall}</span>}
                {h.koeniginGesehen && <span>Königin gesehen</span>}
                {h.schwarmstimmung && <span className="warn">Schwarmstimmung</span>}
                {h.honigernteKg !== undefined && <span>Honig: {h.honigernteKg}kg</span>}
              </div>
              {h.notizen && <div className="verlauf-notiz">{h.notizen}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// Haupt-App
// ============================================================
function ImkerApp() {
  const [daten, setDaten] = useState(() => ladeLokal());
  const [ausgewaehlt, setAusgewaehlt] = useState(null);
  const [zeigeNeu, setZeigeNeu] = useState(false);
  const [zeigeStandorte, setZeigeStandorte] = useState(false);
  const [angemeldet, setAngemeldet] = useState(false);
  const [syncStatus, setSyncStatus] = useState("idle");
  const [fehler, setFehler] = useState(null);
  const syncTimer = useRef(null);

  useEffect(() => {
    initGoogle(async (token) => {
      setAngemeldet(true);
      setSyncStatus("laeuft");
      try {
        const remote = await drivePull();
        if (remote) setDaten(remote);
        setSyncStatus("ok");
      } catch (e) {
        setSyncStatus("fehler");
      }
    });
  }, []);

  // Lokale Speicherung bei jeder Änderung
  useEffect(() => {
    const ok = speichereLokal(daten);
    if (!ok) setFehler("Lokaler Speicher ist voll — evtl. alte Fotos löschen.");
  }, [daten]);

  // Debounced Drive-Sync bei Änderung
  useEffect(() => {
    if (!angemeldet) return;
    if (syncTimer.current) clearTimeout(syncTimer.current);
    syncTimer.current = setTimeout(async () => {
      setSyncStatus("laeuft");
      try {
        await drivePush(daten);
        setSyncStatus("ok");
      } catch (e) {
        if (e && e.code === 401) {
          googleStillErneuern();
        }
        setSyncStatus("fehler");
      }
    }, 2500);
    return () => clearTimeout(syncTimer.current);
  }, [daten, angemeldet]);

  const syncJetzt = async () => {
    setSyncStatus("laeuft");
    try { await drivePush(daten); setSyncStatus("ok"); }
    catch { setSyncStatus("fehler"); }
  };

  const volkAktualisieren = (updated) => setDaten((d) => ({ ...d, voelker: d.voelker.map((v) => (v.id === updated.id ? updated : v)) }));
  const volkLoeschen = (id) => { setDaten((d) => ({ ...d, voelker: d.voelker.filter((v) => v.id !== id) })); setAusgewaehlt(null); };
  const neuesVolkAnlegen = (info) => {
    const volk = { id: `v_${Date.now()}`, ...info, history: [], fotos: [] };
    setDaten((d) => ({ ...d, voelker: [...d.voelker, volk] }));
    setZeigeNeu(false); setAusgewaehlt(volk.id);
  };
  const standortHinzufuegen = (info) => {
    const neu = { id: `s_${Date.now()}`, ...info };
    setDaten((d) => ({ ...d, standorte: [...d.standorte, neu] }));
    return neu;
  };
  const standortLoeschen = (id) => setDaten((d) => ({ ...d, standorte: d.standorte.filter((s) => s.id !== id) }));

  const aktuellesVolk = daten.voelker.find((v) => v.id === ausgewaehlt);

  return (
    <div className="app-root">
      <SyncLeiste status={syncStatus} angemeldet={angemeldet} onAnmelden={googleAnmelden} onSyncJetzt={syncJetzt} />
      {!aktuellesVolk && (
        <VolkListe voelker={daten.voelker} standorte={daten.standorte} onSelect={setAusgewaehlt} onNeu={() => setZeigeNeu(true)} onStandorte={() => setZeigeStandorte(true)} />
      )}
      {aktuellesVolk && (
        <Stockkarte volk={aktuellesVolk} standorte={daten.standorte} onZurueck={() => setAusgewaehlt(null)} onUpdate={volkAktualisieren} onDelete={volkLoeschen} />
      )}
      {zeigeNeu && <NeuesVolkDialog standorte={daten.standorte} onSave={neuesVolkAnlegen} onCancel={() => setZeigeNeu(false)} onAddStandort={standortHinzufuegen} />}
      {zeigeStandorte && <StandortDialog standorte={daten.standorte} onAdd={standortHinzufuegen} onDelete={standortLoeschen} onClose={() => setZeigeStandorte(false)} />}
      {fehler && <div className="fehler-banner">{fehler}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ImkerApp />);
</script>
